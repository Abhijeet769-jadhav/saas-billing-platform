# ===========================================================
# Render Deployment Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ===========================================================
# This file deploys the full SaaS Billing Platform on Render:
#   - PostgreSQL managed database
#   - Spring Boot backend (Web Service)
#   - React frontend (Static Site)
# ===========================================================

databases:
  - name: saas-billing-db
    databaseName: saas_billing
    user: billing_user
    plan: free
    region: oregon

services:
  # ─────────────────────────────────────────────
  # Backend: Spring Boot API
  # ─────────────────────────────────────────────
  - type: web
    name: saas-billing-backend
    runtime: java
    region: oregon
    plan: free
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: java -jar backend/target/billing-platform-1.0.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saas-billing-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: saas-billing-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: saas-billing-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_API_KEY
        value: sk_test_mock_key_51Osaasbillingplatformmockkey
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_mock_webhook_secret_key_for_testing
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SERVER_PORT
        value: "8080"

  # ─────────────────────────────────────────────
  # Frontend: React (Vite) Static Site
  # ─────────────────────────────────────────────
  - type: web
    name: saas-billing-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: saas-billing-backend
          type: web
          property: hostport
